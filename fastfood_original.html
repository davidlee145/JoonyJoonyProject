      * {

      html,

        padding: 0;
        width: 100%;
        min-height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background: radial-gradient(
          circle at top,
          #fff6ea 0%,
          #ffe6bd 56%,
          #ffd48f 100%
        );
        font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        touch-action: none;
      }
      body {
        display: grid;
        place-items: center;
      }
      #game-wrap {
        width: min(100vw, calc(100dvh * 0.5625));
        height: min(100dvh, calc(100vw * 1.7777777778));
        display: grid;
        place-items: center;
        margin: auto;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        border-radius: 20px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
      }
      #ui-modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.18s ease;
        z-index: 9999;
      }
      #ui-modal.is-open {
        pointer-events: auto;
        opacity: 1;
      }
      .ui-modal__backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.46);
        backdrop-filter: blur(2px);
      }
      .ui-modal__panel {
        position: relative;
        width: min(92vw, 560px);
        background: #fffbf4;
        border: 6px solid var(--modal-accent, #d81f2a);
        border-radius: 30px;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.24);
        padding: 34px 28px 28px;
        text-align: center;
      }
      .ui-modal__title {
        margin: 0 0 18px;
        font-size: clamp(34px, 5vw, 50px);
        line-height: 1.15;
        color: var(--modal-accent, #d81f2a);
      }
      .ui-modal__summary,
      .ui-modal__detail {
        margin: 0;
        white-space: pre-line;
        color: #5f3323;
      }
      .ui-modal__summary {
        font-size: clamp(24px, 3.7vw, 32px);
        font-weight: 700;
      }
      .ui-modal__detail {
        margin-top: 20px;
        font-size: clamp(20px, 3vw, 27px);
        line-height: 1.5;
      }
      .ui-modal__button {
        margin-top: 28px;
        width: min(100%, 300px);
        min-height: 82px;
        border: 0;
        border-radius: 22px;
        background: var(--modal-accent, #d81f2a);
        color: #fff;
        font-size: clamp(28px, 4vw, 34px);
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;

      const ROUND_PAY = 5000;

      function getPipeTarget(round) {
        const index = Math.max(0, Math.min(MAX_ROUNDS - 1, round - 1));
        return ROUND_PIPE_TARGETS[index];
      }

      function getCompletedRounds(round) {
        return Math.max(0, Math.min(MAX_ROUNDS, round - 1));
      }

      function calculateSalary(completedRounds) {
        return completedRounds * ROUND_PAY;
      }

        return value.toLocaleString("ko-KR") + "원";

        const summaryEl = root.querySelector(".ui-modal__summary");
        const detailEl = root.querySelector(".ui-modal__detail");
        const buttonEl = document.getElementById("ui-modal-button");
        let primaryAction = null;

        buttonEl.addEventListener("click", () => {
          const action = primaryAction;
          hide();
          if (typeof action === "function") action();
        });

        function hide() {
          primaryAction = null;
          root.classList.remove("is-open");
          root.setAttribute("aria-hidden", "true");
        }

        function show({ title, summary = "", detail = "", buttonLabel, accent = "#d81f2a", onPrimary }) {
          panel.style.setProperty("--modal-accent", accent);
          titleEl.textContent = title || "";
          summaryEl.textContent = summary || "";
          detailEl.textContent = detail || "";
          detailEl.style.display = detail ? "block" : "none";
          buttonEl.textContent = buttonLabel || "확인";
          primaryAction = onPrimary || null;
          root.classList.add("is-open");
          root.setAttribute("aria-hidden", "false");
          buttonEl.focus({ preventScroll: true });
        }

        return { show, hide };
      })();

      class GameAudioManager {
        constructor() {
          this.masterVolume = 1;
          this.sfxVolume = 0.9;
          this.musicVolume = 0.26;
          this.muted = false;
          this.audioCache = new Map();
          this.music = null;
          this.musicKey = null;
          this.desiredMusicKey = null;
          this.audioContext = null;
        }

        preloadAll() {
          const urls = new Set(Object.values(SOUND_URLS).flat());
          urls.forEach((url) => this.prepare(url));
        }

        prepare(url) {
          if (!this.audioCache.has(url)) {
            const audio = new Audio(url);
            audio.preload = "auto";
            this.audioCache.set(url, audio);
          }
          return this.audioCache.get(url);
        }

        unlock() {
          this.ensureContext();
          this.preloadAll();
        }

        ensureContext() {
          if (this.audioContext) {
            if (this.audioContext.state === "suspended")
              this.audioContext.resume();
            return this.audioContext;
          }

          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;

          this.audioContext = new Ctx();
          if (this.audioContext.state === "suspended")
            this.audioContext.resume();
          return this.audioContext;
        }

        clampVolume(value) {
          return Phaser.Math.Clamp(value, 0, 1);
        }

        toggleMute() {
          this.muted = !this.muted;

          if (this.muted) {
            if (this.music) this.music.pause();
          } else if (this.desiredMusicKey) {
            this.playMusic(this.desiredMusicKey);
          }

          return this.muted;
        }

        play(name, options = {}) {
          if (this.muted) return;

          const list = SOUND_URLS[name];
          if (!list || list.length === 0) {
            this.playSynth(name, options);
            return;
          }

          this.unlock();

          const url = list[Math.floor(Math.random() * list.length)];
          const base = this.prepare(url);
          const audio = base.cloneNode();
          audio.volume = this.clampVolume(
            (options.volume ?? 1) * this.sfxVolume * this.masterVolume,
          );
          audio.playbackRate = Phaser.Math.Clamp(
            (options.rate ?? 1) +
              (Math.random() * 2 - 1) * (options.rateJitter ?? 0),
            0.82,
            1.22,
          );

          const playPromise = audio.play();
          if (playPromise?.catch) {
            playPromise.catch(() => this.playSynth(name, options));
          }
        }

        playMusic(name) {
          this.desiredMusicKey = name;
          if (this.muted) return;
          if (this.musicKey === name && this.music && !this.music.paused)
            return;

          const list = SOUND_URLS[name];
          if (!list || list.length === 0) return;

          this.unlock();
          this.stopMusic();

          const music = this.prepare(list[0]).cloneNode();
          music.loop = true;
          music.volume = this.clampVolume(this.musicVolume * this.masterVolume);

          const playPromise = music.play();
          if (playPromise?.catch) {
            playPromise.catch(() => {
              this.music = null;
              this.musicKey = null;
            });
          }

          this.music = music;
          this.musicKey = name;
        }

        stopMusic() {
          if (this.music) {
            this.music.pause();
            this.music.currentTime = 0;
          }
          this.music = null;
          this.musicKey = null;
        }

        playSynth(name, options = {}) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;

          const now = ctx.currentTime;
          const volume = this.clampVolume(
            0.05 * (options.volume ?? 1) * this.sfxVolume * this.masterVolume,
          );

          const tone = (
            freqA,
            freqB,
            duration,
            type = "triangle",
            delay = 0,
          ) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freqA, now + delay);
            osc.frequency.exponentialRampToValueAtTime(
              Math.max(40, freqB),
              now + delay + duration,
            );
            gain.gain.setValueAtTime(0.0001, now + delay);
            gain.gain.exponentialRampToValueAtTime(volume, now + delay + 0.01);
            gain.gain.exponentialRampToValueAtTime(
              0.0001,
              now + delay + duration,
            );
            osc.connect(gain).connect(ctx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + duration + 0.02);
          };

          switch (name) {
            case "success":
            case "win":
              tone(520, 860, 0.1, "sine", 0);
              tone(740, 1180, 0.14, "triangle", 0.07);
              break;
            case "fail":
            case "crash":
              tone(280, 140, 0.16, "square", 0);
              break;
            case "gate":
              tone(880, 1160, 0.06, "triangle", 0);
              break;
            default:
              tone(420, 620, 0.06, "triangle", 0);
              break;
          }
        }
      }

        const width = 150;

        const x = rightX - width / 2;

        const bg = scene.add
          .rectangle(x, centerY, width, height, 0x92231d, 0.92)
          .setStrokeStyle(3, 0xf6d6a8)
          .setInteractive({ useHandCursor: true })
          .setDepth(1000);

        const label = scene.add
          .text(x, centerY, "", {
            fontSize: "20px",
            color: "#fff",
            fontStyle: "bold",
          })
          .setOrigin(0.5)
          .setDepth(1001);

        const refresh = () => {
          label.setText(GAME_AUDIO.muted ? "사운드 OFF" : "사운드 ON");
        };

        bg.on("pointerdown", () => {
          GAME_AUDIO.toggleMute();
          refresh();
        });

        refresh();
        return { bg, label, refresh };
      }

        return INGREDIENTS[key]?.name || key;

      function randomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function generateRandomOrder(round) {
        const recipe = randomChoice(BURGER_RECIPES);
        const side = randomChoice(SIDE_CHOICES);
        const drink = randomChoice(DRINK_CHOICES);

        const tips = [
          `버거: ${recipe.burger.map(ingredientName).join(" > ")}`,
          `사이드: ${ingredientName(side)}`,
          `음료: ${ingredientName(drink)}`,
        ];

        if (round >= 4 && Math.random() < 0.35) {
          const altDrink = DRINK_CHOICES.find((v) => v !== drink) || drink;
          tips.push(
            `주의: ${ingredientName(altDrink)} 말고 ${ingredientName(drink)}!`,
          );
        }

        return {
          title: recipe.title,
          burger: recipe.burger.slice(),
          side,
          drink,
          tips,
        };
      }

      class KitchenScene extends Phaser.Scene {
        constructor() {
          super("KitchenScene");
        }

        init(data) {
          this.score = data.score ?? 0;
          this.round = data.round ?? 1;
          this.timeLeft = data.timeLeft ?? TOTAL_TIME_LIMIT;
        }

        create() {
          this.selectedKey = null;
          this.currentOrder = null;
          this.burgerStack = [];
          this.burgerSprites = [];
          this.sideState = null;
          this.drinkState = null;
          this.gameStarted = false;
          this.isGameOver = false;

          this.drawBackground();
          this.drawTopUI();
          this.soundToggle = attachSoundToggle(
            this,
            SOUND_TOGGLE_RIGHT,
            SOUND_TOGGLE_Y,
          );

          if (this.round > MAX_ROUNDS) {
            this.endGame(true, "오늘의 10라운드를 모두 완료했어요!");
            return;
          }

          if (this.timeLeft <= 0) {
            this.endGame(false, "근무 시간이 끝났습니다!");
            return;
          }

          this.drawCustomerArea();
          this.drawOrderPanel();
          this.drawKitchen();
          this.drawPalette();

          const isFreshStart =
            this.round === 1 &&
            this.score === 0 &&
            this.timeLeft === TOTAL_TIME_LIMIT;

          if (isFreshStart) {
            this.drawStartOverlay();
          } else {
            this.gameStarted = true;
            this.loadOrder();
            GAME_AUDIO.playMusic("kitchenMusic");
          }

          this.timeEvent = this.time.addEvent({
            delay: 1000,
            loop: true,
            callback: () => {
              if (!this.gameStarted || this.isGameOver) return;
              this.timeLeft--;
              this.timerText.setText("남은 시간: " + this.timeLeft);
              if (this.timeLeft <= 0) this.endGame();
            },
          });
        }

              if (!this.gameStarted || this.isGameOver) return;

            this.paletteItems.push({ key, card });

          this.loadOrder();

        selectIngredient(key) {
          GAME_AUDIO.play("uiSelect", { volume: 0.62, rateJitter: 0.03 });
          this.selectedKey = key;
          const item = this.paletteItems.find((v) => v.key === key);
          this.selectOutline
            .setPosition(item.card.x, item.card.y)
            .setVisible(true);
          this.selectedText.setText("선택 재료: " + INGREDIENTS[key].name);

          const category = INGREDIENTS[key].category;
          if (category === "burger")
            this.showToast("버거 영역을 눌러 순서대로 추가");
          else if (category === "side") this.showToast("사이드 칸을 눌러 배치");
          else this.showToast("음료 칸을 눌러 배치");
        }

        addBurgerLayer() {
          if (!this.selectedKey)
            return this.showToast("먼저 재료를 선택하세요");
          if (INGREDIENTS[this.selectedKey].category !== "burger")
            return this.showToast("버거 재료만 넣을 수 있어요");
          if (this.burgerStack.length >= 10)
            return this.showToast("버거가 너무 높아요!");

          const key = this.selectedKey;
          this.burgerStack.push(key);
          const y = 420 - (this.burgerStack.length - 1) * 16;
          const sprite = this.add
            .image(516, y, INGREDIENTS[key].texture)
            .setScale(0.6);
          this.burgerSprites.push(sprite);
          this.updateStackText();
          GAME_AUDIO.play("stack", { volume: 0.76, rateJitter: 0.05 });
          this.showToast(INGREDIENTS[key].name + " 추가!");
        }

        removeLastBurgerItem() {
          if (this.burgerStack.length === 0)
            return this.showToast("버거에 아무것도 없어요");
          this.burgerStack.pop();
          const sprite = this.burgerSprites.pop();
          if (sprite) sprite.destroy();
          this.updateStackText();
          GAME_AUDIO.play("cancel", { volume: 0.6, rateJitter: 0.04 });
        }

        placeSide() {
          if (!this.selectedKey)
            return this.showToast("먼저 재료를 선택하세요");
          if (INGREDIENTS[this.selectedKey].category !== "side")
            return this.showToast("사이드 칸에는 사이드만!");
          if (this.sideState?.sprite) this.sideState.sprite.destroy();
          this.sideState = {
            key: this.selectedKey,
            sprite: this.add
              .image(445, 525, INGREDIENTS[this.selectedKey].texture)
              .setScale(0.58),
          };
          GAME_AUDIO.play("trayPlace", { volume: 0.72, rateJitter: 0.04 });
          this.showToast("사이드 배치 완료");
        }

        placeDrink() {
          if (!this.selectedKey)
            return this.showToast("먼저 재료를 선택하세요");
          if (INGREDIENTS[this.selectedKey].category !== "drink")
            return this.showToast("음료 칸에는 음료만!");
          if (this.drinkState?.sprite) this.drinkState.sprite.destroy();
          this.drinkState = {
            key: this.selectedKey,
            sprite: this.add
              .image(585, 525, INGREDIENTS[this.selectedKey].texture)

          GAME_AUDIO.play("trayPlace", { volume: 0.76, rateJitter: 0.04 });

        updateStackText() {
          if (this.burgerStack.length === 0)
            return this.stackText.setText("아직 아무것도 없음");
          this.stackText.setText(
            this.burgerStack.map((k) => INGREDIENTS[k].name).join(" > "),

        }

        loadOrder() {
          this.resetTray(false);
          this.currentOrder = generateRandomOrder(this.round);
          this.orderNameText.setText(this.currentOrder.title);
          this.orderDetailText.setText(this.currentOrder.tips.join("\n\n"));

          const bubbleLines = [
            "안녕하세요!",
            this.currentOrder.title + "랑",
            ingredientName(this.currentOrder.side) + "이랑",
            ingredientName(this.currentOrder.drink) + " 주세요!",
          ];
          this.customerText.setText(bubbleLines.join("\n"));
        }

        resetTray(withSound = false) {
          this.burgerStack = [];
          this.burgerSprites.forEach((s) => s.destroy());
          this.burgerSprites = [];
          this.updateStackText();

          if (this.sideState?.sprite) this.sideState.sprite.destroy();
          if (this.drinkState?.sprite) this.drinkState.sprite.destroy();
          this.sideState = null;
          this.drinkState = null;

          if (withSound) {
            GAME_AUDIO.play("cancel", { volume: 0.62, rateJitter: 0.04 });
          }
        }

        gradeTray() {
          const order = this.currentOrder;

          const burgerPerfect =
            JSON.stringify(this.burgerStack) === JSON.stringify(order.burger);
          const sideCorrect =
            this.sideState && this.sideState.key === order.side;
          const drinkCorrect =
            this.drinkState && this.drinkState.key === order.drink;

          if (!burgerPerfect) {
            GAME_AUDIO.play("fail", { volume: 0.78, rateJitter: 0.03 });
            return this.showKitchenResult(
              0,
              "주문 실패!",
              false,
              "버거 구성이 주문서와 달라요!",
            );
          }

          if (!sideCorrect) {
            GAME_AUDIO.play("fail", { volume: 0.78, rateJitter: 0.03 });
            return this.showKitchenResult(
              0,
              "주문 실패!",
              false,
              "사이드를 잘못 골랐어요!",
            );
          }

          if (!drinkCorrect) {
            GAME_AUDIO.play("fail", { volume: 0.78, rateJitter: 0.03 });
            return this.showKitchenResult(
              0,
              "주문 실패!",
              false,
              "음료를 잘못 골랐어요!",
            );
          }

          const total = order.burger.length * 25 + 40 + 40 + 50;

          this.score += total;
          this.scoreText.setText("점수: " + this.score);
          GAME_AUDIO.play("success", { volume: 0.82, rateJitter: 0.02 });
          this.showKitchenResult(
            total,
            "주문 성공!",
            true,
            "주문서를 완벽하게 맞췄어요!",
          );
        }

            title: message,
            summary: success ? `획득 점수: ${total}` : "이번 주문은 다시 확인해요!",
            detail:
              detailText ||
              (success ? "배달하러 출발!" : "주문서를 다시 보고 맞춰보세요."),
            buttonLabel: success ? "배달 가기" : "다시 만들기",
            accent: success ? "#0b8f4d" : "#d81f2a",
            onPrimary: () => {
              if (success) {
                GAME_AUDIO.play("deliveryStart", {
                  volume: 0.8,
                  rateJitter: 0.03,
                });
                this.scene.start("DeliveryScene", {
                  score: this.score,
                  round: this.round,
                  timeLeft: this.timeLeft,
                });
              }
            },
          });

          if (this.toastText) this.toastText.destroy();
          this.toastText = this.add
            .text(GAME_WIDTH / 2, 925, message, {

            })
            .setOrigin(0.5);

            targets: this.toastText,
            alpha: 0,
            y: 895,
            duration: 850,
            onComplete: () => {
              if (this.toastText) {
                this.toastText.destroy();
                this.toastText = null;
              }
            },
          });
        }

      class DeliveryScene extends Phaser.Scene {
        constructor() {
          super("DeliveryScene");
        }

        init(data) {
          this.score = data.score ?? 0;
          this.round = data.round ?? 1;
          this.timeLeft = data.timeLeft ?? TOTAL_TIME_LIMIT;
        }

        create() {
          this.deliveryOver = false;
          this.gameStarted = false;

          this.depths = {
            background: 0,
            pipes: 10,
            riderShadow: 15,
            rider: 20,
            hud: 100,
            button: 120,
            message: 140,
          };

          GAME_AUDIO.playMusic("deliveryMusic");

          this.passedPipes = 0;
          this.targetPipes = getPipeTarget(this.round);

          this.pipeGap = Math.max(250, 340 - (this.round - 1) * 8);
          this.pipeSpeed = Math.min(330, 220 + (this.round - 1) * 10);
          this.pipeSpacing = 360 + Math.max(0, this.round - 1) * 8;
          this.gravityForce = 900;
          this.jumpVelocity = -370;

          this.safeGapTop = 250;
          this.safeGapBottom = 980;
          this.maxGapCenterRise = Math.round(this.pipeSpacing * 0.82);
          this.maxGapCenterDrop = Math.round(this.pipeSpacing * 0.98);
          this.firstGapCenter = Phaser.Math.Clamp(
            560 + Phaser.Math.Between(-110, 110),
            this.safeGapTop,
            this.safeGapBottom,
          );

          this.drawSkyBackground();
          this.drawFlappyHUD();
          this.soundToggle = attachSoundToggle(
            this,
            SOUND_TOGGLE_RIGHT,
            SOUND_TOGGLE_Y,
          );
          this.createRider();
          this.createPipeGroups();
          this.createControls();
          this.createAllPipePairs();

          this.deliveryTimer = this.time.addEvent({
            delay: 1000,
            loop: true,
            callback: () => {
              if (this.deliveryOver) return;
              this.timeLeft--;
              this.updateHUD();
              if (this.timeLeft <= 0) this.timeoutShift();
            },
          });

          this.input.on("pointerdown", () => this.flap());
          this.spaceKey = this.input.keyboard.addKey(
            Phaser.Input.Keyboard.KeyCodes.SPACE,
          );
          this.upKey = this.input.keyboard.addKey(
            Phaser.Input.Keyboard.KeyCodes.UP,
          );

          this.showCenterMessage("화면을 탭해서 배달 출발!");
        }

        drawSkyBackground() {
          this.backgroundScrollers = [];

          const addScroller = (sprite, speed) => {
            this.backgroundScrollers.push({ sprite, speed });
            return sprite;
          };

          const makeSkyGradientTexture = () => {
            const key = "deliverySkyPremiumTex";
            if (!this.textures.exists(key)) {
              const texture = this.textures.createCanvas(
                key,
                GAME_WIDTH,
                GAME_HEIGHT,
              );
              const ctx = texture.getContext();

              const sky = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
              sky.addColorStop(0, "#93d8ff");
              sky.addColorStop(0.34, "#bfeeff");
              sky.addColorStop(0.66, "#ffe6b3");
              sky.addColorStop(1, "#f2b66f");
              ctx.fillStyle = sky;
              ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

              const glow = ctx.createRadialGradient(560, 210, 12, 560, 210, 260);
              glow.addColorStop(0, "rgba(255, 255, 255, 0.88)");
              glow.addColorStop(0.34, "rgba(255, 235, 164, 0.42)");
              glow.addColorStop(1, "rgba(255, 214, 125, 0)");
              ctx.fillStyle = glow;
              ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

              const haze = ctx.createLinearGradient(0, 520, 0, 920);
              haze.addColorStop(0, "rgba(255, 255, 255, 0)");
              haze.addColorStop(0.56, "rgba(255, 255, 255, 0.28)");
              haze.addColorStop(1, "rgba(255, 250, 230, 0.06)");
              ctx.fillStyle = haze;
              ctx.fillRect(0, 520, GAME_WIDTH, 420);

              texture.refresh();
            }
            return key;
          };

          const makeSoftCloudTexture = () => {
            const key = "deliverySoftCloudTex";
            if (!this.textures.exists(key)) {
              const g = this.make.graphics({ x: 0, y: 0, add: false });
              g.fillStyle(0xffffff, 0.92);
              g.fillEllipse(64, 52, 92, 46);
              g.fillEllipse(125, 42, 86, 54);
              g.fillEllipse(190, 54, 112, 46);
              g.fillEllipse(242, 60, 76, 34);
              g.fillStyle(0xd9f2ff, 0.32);
              g.fillEllipse(122, 66, 198, 24);
              g.fillEllipse(212, 72, 120, 18);
              g.generateTexture(key, 300, 110);
              g.destroy();
            }
            return key;
          };

          const makeMountainTexture = () => {
            const key = "deliveryMountainTileTex";
            if (!this.textures.exists(key)) {
              const g = this.make.graphics({ x: 0, y: 0, add: false });
              g.fillStyle(0x9fc5cf, 0.52);
              g.beginPath();
              g.moveTo(0, 220);
              g.lineTo(120, 82);
              g.lineTo(250, 220);
              g.lineTo(360, 112);
              g.lineTo(520, 220);
              g.lineTo(680, 92);
              g.lineTo(840, 220);
              g.lineTo(960, 128);
              g.lineTo(960, 260);
              g.lineTo(0, 260);
              g.closePath();
              g.fillPath();

              g.fillStyle(0xe7f9ff, 0.38);
              g.fillTriangle(96, 110, 120, 82, 154, 118);
              g.fillTriangle(646, 120, 680, 92, 716, 126);
              g.fillTriangle(932, 150, 960, 128, 960, 176);
              g.generateTexture(key, 960, 260);
              g.destroy();
            }
            return key;
          };

          const makeSkylineTexture = (key, palette, alpha = 1) => {
            if (this.textures.exists(key)) return key;

            const g = this.make.graphics({ x: 0, y: 0, add: false });
            const width = 960;
            const height = 340;
            const buildings = [
              [12, 160, 72, 170],
              [96, 102, 86, 228],
              [198, 138, 62, 192],
              [276, 70, 94, 260],
              [390, 124, 78, 206],
              [486, 92, 108, 238],
              [616, 150, 68, 180],
              [700, 84, 96, 246],
              [814, 118, 72, 212],
              [900, 142, 74, 188],
            ];

            buildings.forEach(([x, y, w, h], i) => {
              const color = palette[i % palette.length];
              g.fillStyle(color, alpha);
              g.fillRoundedRect(x, y, w, h, 10);
              g.fillStyle(0xffffff, alpha * 0.26);
              for (let yy = y + 22; yy < y + h - 24; yy += 32) {
                for (let xx = x + 14; xx < x + w - 14; xx += 24) {
                  if ((xx + yy + i * 7) % 5 !== 0) {
                    g.fillRoundedRect(xx, yy, 12, 14, 3);
                  }
                }
              }
              g.fillStyle(0x455a64, alpha * 0.28);
              g.fillRect(x + w * 0.2, y - 8, w * 0.34, 8);
            });

            g.fillStyle(0xffffff, 0.16);
            g.fillRect(0, 296, width, 10);
            g.generateTexture(key, width, height);
            g.destroy();
            return key;
          };

          const makeStorefrontTexture = () => {
            const key = "deliveryStorefrontTileTex";
            if (this.textures.exists(key)) return key;

            const g = this.make.graphics({ x: 0, y: 0, add: false });
            const shops = [
              { x: 0, w: 180, c: 0xf7c8a0, awning: 0xd81f2a, sign: "FAST" },

        flap() {
          if (this.deliveryOver) return;

          GAME_AUDIO.unlock();

          if (!this.gameStarted) {
            this.gameStarted = true;
            if (this.centerMessage) this.centerMessage.destroy();

            if (this.idleTween) {
              this.idleTween.stop();
              this.idleTween = null;
            }

            this.rider.body.setAllowGravity(true);
            this.rider.body.setGravityY(this.gravityForce);
            this.rider.body.setVelocityY(0);
            this.startObstacleMotion();
          }

          this.rider.setVelocityY(this.jumpVelocity);
          this.rider.setAngle(-18);
          GAME_AUDIO.play("flap", { volume: 0.7, rateJitter: 0.06 });

          this.tweens.add({
            targets: this.rider,
            angle: 10,
            duration: 260,
            ease: "Quad.Out",
          });
        }

        createAllPipePairs() {
          const startX = GAME_WIDTH + 120;
          let previousGapCenter = this.firstGapCenter;

          for (let i = 0; i < this.targetPipes; i++) {
            const x = startX + i * this.pipeSpacing;
            const gapCenter = this.getNextGapCenter(i, previousGapCenter);
            this.spawnPipePair(x, false, gapCenter);
            previousGapCenter = gapCenter;
          }
        }

        getNextGapCenter(index, previousGapCenter) {
          if (index === 0) return this.firstGapCenter;

          const minCenter = Math.max(
            this.safeGapTop,
            previousGapCenter - this.maxGapCenterRise,
          );
          const maxCenter = Math.min(
            this.safeGapBottom,
            previousGapCenter + this.maxGapCenterDrop,
          );

          if (minCenter >= maxCenter) {
            return Phaser.Math.Clamp(
              previousGapCenter,
              this.safeGapTop,
              this.safeGapBottom,
            );
          }

          return Phaser.Math.Between(minCenter, maxCenter);
        }

        spawnPipePair(x, startMoving = true, gapCenter = null) {
          const resolvedGapCenter = Phaser.Math.Clamp(
            gapCenter ?? this.firstGapCenter,
            this.safeGapTop,
            this.safeGapBottom,
          );
          const gapHalf = this.pipeGap / 2;

          const topHeight = resolvedGapCenter - gapHalf;
          const bottomY = resolvedGapCenter + gapHalf;
          const bottomHeight = GAME_HEIGHT - bottomY - 70;

          this.addPipe(x, topHeight / 2, 92, topHeight, true, startMoving);
          this.addPipe(
            x,
            bottomY + bottomHeight / 2,
            92,
            bottomHeight,
            false,
            startMoving,
          );

          // 실제 장애물(몸통 92, 캡 118)보다 약간 뒤쪽에 넉넉한 통과 판정 존을 둔다.
          const zone = this.add.zone(x + 86, GAME_HEIGHT / 2, 84, GAME_HEIGHT);
          this.physics.add.existing(zone);
          zone.body.setAllowGravity(false);
          zone.body.setImmovable(true);
          zone.body.setVelocityX(startMoving ? -this.pipeSpeed : 0);
          zone.passed = false;
          this.scoreZones.add(zone);
        }

        startObstacleMotion() {
          this.pipes.children.each((obj) => {
            if (obj?.body) obj.body.setVelocityX(-this.pipeSpeed);
          });

          this.scoreZones.children.each((zone) => {
            if (zone?.body) zone.body.setVelocityX(-this.pipeSpeed);
          });
        }

        addPipe(x, y, w, h, isTop, startMoving = true) {
          const pipe = this.add
            .rectangle(x, y, w, h, 0x46a35d)
            .setDepth(this.depths.pipes);
          pipe.setStrokeStyle(6, 0x2f6e40);

          const capY = isTop ? y + h / 2 - 18 : y - h / 2 + 18;
          const cap = this.add
            .rectangle(x, capY, 118, 36, 0x5bc475)
            .setDepth(this.depths.pipes);
          cap.setStrokeStyle(5, 0x2f6e40);

          this.physics.add.existing(pipe);
          this.physics.add.existing(cap);

          pipe.body.setImmovable(true);
          pipe.body.setAllowGravity(false);
          pipe.body.setVelocityX(startMoving ? -this.pipeSpeed : 0);

          cap.body.setImmovable(true);
          cap.body.setAllowGravity(false);
          cap.body.setVelocityX(startMoving ? -this.pipeSpeed : 0);

          this.pipes.add(pipe);
          this.pipes.add(cap);

          return { pipe, cap };
        }

        passGate(rider, zone) {
          if (!this.gameStarted || zone.passed || this.deliveryOver) return;

          zone.passed = true;
          zone.destroy();

          this.passedPipes++;
          this.deliveryBonus += 3;
          this.score += 8;

          this.updateHUD();
          GAME_AUDIO.play("gate", { volume: 0.82, rateJitter: 0.04 });
          this.showToast("통과 성공!");

          if (this.passedPipes >= this.targetPipes) {
            this.completeDelivery();
          }
        }

        hitPipe() {
          if (this.deliveryOver) return;
          this.failDelivery("건물 사이에 부딪혔어요!");
        }

        failDelivery(reason) {
          if (this.deliveryOver) return;
          this.deliveryOver = true;

          GAME_AUDIO.stopMusic();
          GAME_AUDIO.play("crash", { volume: 0.92, rateJitter: 0.03 });

          this.physics.pause();
          if (this.deliveryTimer) this.deliveryTimer.remove(false);

          this.rider.setTint(0xff8a80);
          this.cameras.main.shake(160, 0.012);

          this.time.delayedCall(600, () => {
            this.showResultOverlay(false, reason);
          });
        }

        timeoutShift() {
          if (this.deliveryOver) return;
          this.deliveryOver = true;

          GAME_AUDIO.stopMusic();
          GAME_AUDIO.play("fail", { volume: 0.78, rateJitter: 0.02 });

          this.physics.pause();
          if (this.deliveryTimer) this.deliveryTimer.remove(false);

          const completedRounds = getCompletedRounds(this.round);
          const salary = calculateSalary(completedRounds);

          this.showResultOverlay(
            false,
            `배달 시간이 종료되어 오늘 근무를 마감했어요.
완료 라운드 ${completedRounds} / ${MAX_ROUNDS}
오늘 알바비 ${formatWon(salary)}`,
            true,
          );
        }

        completeDelivery() {
          if (this.deliveryOver) return;
          this.deliveryOver = true;

          GAME_AUDIO.stopMusic();
          GAME_AUDIO.play("win", { volume: 0.92, rateJitter: 0.02 });

          this.physics.pause();
          if (this.deliveryTimer) this.deliveryTimer.remove(false);

          const bonusScore = 20 + this.round * 4 + this.deliveryBonus;
          this.score += bonusScore;

          this.tweens.add({
            targets: this.rider,
            x: GAME_WIDTH / 2 + 120,
            y: 320,
            angle: -10,
            duration: 700,
            ease: "Quad.Out",
          });

          this.time.delayedCall(800, () => {
            this.showResultOverlay(true, `배달 완료! 보너스 +${bonusScore}`);
          });
        }

        showResultOverlay(success, detailText, isShiftEnd = false) {
          UI_MODAL.show({
            title: isShiftEnd ? "근무 종료!" : success ? "배달 성공!" : "배달 실패!",
            summary: isShiftEnd
              ? `최종 점수: ${this.score}`
              : success
                ? `현재 점수: ${this.score}`
                : "다시 조심해서 점프해 봐요!",
            detail: detailText,
            buttonLabel: isShiftEnd
              ? "다시 시작"
              : success
                ? "다음 주문 받기"
                : "같은 라운드 재도전",
            accent: success ? "#0b8f4d" : "#d81f2a",
            onPrimary: () => {
              GAME_AUDIO.play(success ? "success" : "uiSelect", {
                volume: 0.72,
                rateJitter: 0.02,
              });

              if (isShiftEnd) {
                this.scene.start("KitchenScene", {
                  score: 0,
                  round: 1,
                  timeLeft: TOTAL_TIME_LIMIT,
                });
                return;
              }

              this.scene.start("KitchenScene", {
                score: this.score,
                round: success ? this.round + 1 : this.round,
                timeLeft: this.timeLeft,
              });
            },
          });
        }

        update() {
          if (this.deliveryOver) return;

          if (
            Phaser.Input.Keyboard.JustDown(this.spaceKey) ||
            Phaser.Input.Keyboard.JustDown(this.upKey)
          ) {
            this.flap();
          }

          if (this.gameStarted) {
            (this.backgroundScrollers || []).forEach(({ sprite, speed }) => {
              if (sprite && sprite.tilePositionX !== undefined) {
                sprite.tilePositionX += speed;
              }
            });
          }

          if (this.rider.body.velocity.y > 0) {
            this.rider.setAngle(
              Phaser.Math.Clamp(this.rider.body.velocity.y * 0.05, -20, 70),
            );
          }

          if (this.rider.y < 120) {
            this.rider.y = 120;
            this.rider.setVelocityY(80);
          }

          if (this.rider.y > GAME_HEIGHT - 110) {
            this.failDelivery("바닥에 떨어졌어요!");
          }

          this.pipes.children.each((obj) => {
            if (obj && obj.active && obj.x < -120) {
              obj.destroy();
            }
          });

          this.scoreZones.children.each((zone) => {
            if (zone && zone.active && zone.x < -40) {
              zone.destroy();
            }
          });

          this.riderShadow.x = this.rider.x + 5;
          this.riderShadow.width = Phaser.Math.Clamp(
            120 - (this.rider.y - 240) * 0.05,
            60,
            120,
          );
        }
      }

      const config = {
        type: Phaser.AUTO,
        parent: "game-wrap",
        width: GAME_WIDTH,
