<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>주니주니 랜덤 게임</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Jua&display=swap");
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background: radial-gradient(
          circle at top,
          #384f94,
          #08112f 62%,
          #040715
        );
        color: #fff;
        touch-action: none;
      }
      body:before {
        content: "";
        position: fixed;
        inset: -20%;
        background:
          radial-gradient(
            circle at 20% 15%,
            rgba(92, 220, 255, 0.25),
            transparent 32%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(255, 214, 85, 0.18),
            transparent 32%
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(255, 92, 169, 0.16),
            transparent 35%
          );
        pointer-events: none;
      }
      .screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .hidden {
        display: none !important;
      }
      #introScreen {
        flex-direction: column;
        gap: 18px;
        text-align: center;
      }
      .introGlow {
        position: absolute;
        width: min(78vw, 520px);
        height: min(78vw, 520px);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.3),
          rgba(78, 217, 255, 0.1) 50%,
          transparent 72%
        );
        filter: blur(16px);
        animation: pulse 2.2s ease-in-out infinite;
      }
      .logo {
        position: relative;
        width: min(70vw, 450px);
        max-width: 88%;
        opacity: 0;
        transform: scale(0.82);
        filter: drop-shadow(0 22px 42px rgba(0, 0, 0, 0.35));
        transition:
          opacity 1.15s ease,
          transform 1.15s ease;
      }
      .logo.show {
        opacity: 1;
        transform: scale(1);
      }
      .introTitle {
        position: relative;
        font-size: clamp(32px, 5vw, 54px);
        font-weight: 900;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);

        opacity: 0;
        transform: translateY(18px) scale(0.96);
        transition:
          opacity 1.15s ease,
          transform 1.15s ease;
      }

      .introTitle.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .panel {
        width: min(100%, 1040px);
        max-height: calc(100dvh - 28px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 30px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.16),
          rgba(255, 255, 255, 0.08)
        );
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
        backdrop-filter: blur(18px);
        overflow: hidden;
      }
      #rouletteScreen .panel {
        padding: 22px;
        display: grid;
        grid-template-columns: minmax(320px, 520px) minmax(280px, 1fr);
        gap: 18px;
        align-items: center;
      }
      .wheelWrap {
        position: relative;
        width: min(80vw, 500px);
        aspect-ratio: 1;
        margin: auto;
        display: grid;
        place-items: center;
      }
      #wheel {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 26px 38px rgba(0, 0, 0, 0.42));
      }
      .pointer {
        position: absolute;
        top: -4px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 22px solid transparent;
        border-right: 22px solid transparent;
        border-top: 52px solid #fff4bf;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
        z-index: 5;
      }
      .info {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .badge {
        width: fit-content;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ffe374;
        font-weight: 900;
      }
      .title {
        margin: 0;
        font-size: clamp(32px, 4vw, 52px);
        line-height: 1.05;
      }
      .desc {
        margin: 0;
        color: #d7e2ff;
        font-size: clamp(16px, 2vw, 22px);
        line-height: 1.5;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }
      .pill {
        padding: 9px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.16);
        font-weight: 800;
        font-size: 14px;
      }
      .result {
        border-radius: 24px;
        padding: 16px 18px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
        min-height: 88px;
      }
      .result small {
        color: #b8c9ff;
        font-weight: 800;
      }
      .result strong {
        display: block;
        margin-top: 6px;
        font-size: clamp(22px, 3vw, 32px);
      }
      .status {
        margin-top: 5px;
        color: #d5e0ff;
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        border: 0;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .action {
        min-width: 145px;
        border-radius: 18px;
        padding: 16px 20px;
        font-size: 18px;
        font-weight: 900;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
      }
      .action:active {
        transform: translateY(2px);
      }
      .action[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .spin {
        background: linear-gradient(#57e4ff, #238dff);
      }
      .stop {
        background: linear-gradient(#ff7c9e, #ff4182);
      }
      .choose {
        background: linear-gradient(#9aadff, #6075ff);
      }
      #gameScreen {
        padding: 0;
        align-items: stretch;
        justify-content: stretch;
        background: radial-gradient(
          circle at top,
          #ffeab2,
          #8fcf78 46%,
          #316248 100%
        );
      }
      .gameShell {
        position: relative;
        flex: 1;
        display: block;
        min-height: 100%;
        height: 100%;
      }
      .topbar {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 0;
        padding: 0;
        background: transparent;
        border: 0;
        z-index: 10;
        pointer-events: none;
      }
      .back {
        border-radius: 14px;
        background: linear-gradient(#91a7ff, #6075ff);
        padding: 12px 14px;
        font-weight: 900;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
        pointer-events: auto;
      }
      .gameTitle {
        display: none;
      }
      #gameHost {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(
          circle at top,
          #ffeab2,
          #8fcf78 46%,
          #316248 100%
        );
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }
      .modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.55);
        z-index: 20;
        backdrop-filter: blur(5px);
      }
      .modal.show {
        display: flex;
      }
      .modalCard {
        width: min(90vw, 520px);
        border-radius: 28px;
        padding: 26px 22px;
        background: #f7fbff;
        color: #23304d;
        text-align: center;
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.35);
      }
      .modalCard h2 {
        margin: 0 0 12px;
        font-size: clamp(28px, 4vw, 38px);
      }
      .modalCard p {
        white-space: pre-line;
        font-size: clamp(18px, 2.5vw, 23px);
        line-height: 1.5;
      }
      .modalCard .action {
        margin-top: 14px;
        background: linear-gradient(#65d799, #2f9e72);
      }
      @media (max-width: 860px) {
        .screen {
          padding: 8px;
        }
        #rouletteScreen .panel {
          height: calc(100dvh - 16px);
          padding: 10px;
          grid-template-columns: 1fr;
          grid-template-rows: auto auto;
          gap: 4px;
        }
        .wheelWrap {
          width: min(86vw, calc((100dvh - 250px) * 0.96), 390px);
        }
        .info {
          gap: 8px;
          align-items: center;
          text-align: center;
        }
        .badge,
        .desc,
        .pills {
          display: none;
        }
        .title {
          font-size: clamp(24px, 7vw, 34px);
        }
        .result {
          padding: 10px 12px;
          min-height: 66px;
          width: min(96%, 420px);
        }
        .result strong {
          font-size: clamp(18px, 5.2vw, 24px);
          margin-top: 2px;
        }
        .result small,
        .status {
          font-size: 12px;
        }
        .controls {
          width: 100%;
          justify-content: center;
          gap: 8px;
        }
        .action {
          min-width: 31%;
          padding: 13px 8px;
          border-radius: 15px;
          font-size: 15px;
        }
        .topbar {
          top: 8px;
          left: 8px;
        }
        .back {
          padding: 10px 12px;
          font-size: 14px;
        }
        .gameTitle {
          display: none;
        }
      }
      @media (max-height: 700px) {
        .wheelWrap {
          width: min(74vw, calc((100dvh - 220px) * 0.92), 320px);
        }
        .title {
          font-size: 24px;
        }
        .result {
          min-height: 58px;
        }
        .action {
          padding: 10px 8px;
        }
      }
    </style>
  </head>
  <body>
    <section id="introScreen" class="screen">
      <div class="introGlow"></div>
      <img id="introLogo" class="logo" src="logo.png" alt="주니주니 로고" />
      <div id="introTitle" class="introTitle">주니주니 랜덤 게임</div>
    </section>
    <section id="rouletteScreen" class="screen hidden">
      <div class="panel">
        <div class="wheelWrap">
          <div class="pointer"></div>
          <canvas id="wheel" width="560" height="560"></canvas>
        </div>
        <div class="info">
          <div class="badge">🎲 성경도 배우고 게임도 즐겨요</div>
          <h1 class="title">주니주니 랜덤 게임</h1>
          <p class="desc">
            룰렛을 돌려 게임을 골라보세요. 성경 이야기를 게임 속에서 자연스럽게
            배울 수 있어요.
          </p>
          <div class="pills">
            <div class="pill">🍔 패스트푸드 알바</div>
            <div class="pill">🪨 다윗의 용기</div>
            <div class="pill">🤖 AI 미션</div>
          </div>
          <div class="result">
            <small>선택 결과</small
            ><strong id="resultText">룰렛을 돌려 게임을 골라보세요!</strong>
            <div id="status" class="status">
              돌리기와 멈추기 버튼으로 조작합니다.
            </div>
          </div>
          <div class="controls">
            <button id="spinBtn" class="action spin">돌리기</button
            ><button id="stopBtn" class="action stop" disabled>멈추기</button
            ><button id="selectBtn" class="action choose">직접 선택</button>
          </div>
        </div>
      </div>
    </section>
    <section id="gameScreen" class="screen hidden">
      <div class="gameShell">
        <div class="topbar">
          <button id="backBtn" class="back">← 룰렛으로 돌아가기</button>
          <div id="gameTitle" class="gameTitle" aria-hidden="true">게임</div>
        </div>
        <div id="gameHost"></div>
      </div>
    </section>
    <div id="modal" class="modal">
      <div class="modalCard">
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
        <button id="modalBtn" class="action">확인</button>
      </div>
    </div>
    <script>
      (() => {
        const BUILD_MODE = "external";
        const GAME_FILES = {
          fastfood: "fastfood_original.html",
          david: "david_adventure.html",
        };
        const GAME_SOURCES = null;
        const TAU = Math.PI * 2;
        const options = [
          {
            id: "fastfood",
            title: "패스트푸드 알바",
            label: ["패스트푸드", "알바"],
            colors: ["#ffbf43", "#ff7f43"],
          },
          {
            id: "david",
            title: "성경 모험: 다윗의 용기",
            label: ["다윗의", "용기"],
            colors: ["#7be495", "#2fbf71"],
          },
          {
            id: "ai",
            title: "AI 미션",
            label: ["AI로", "직접", "게임 만들기"],
            colors: ["#ff78c7", "#895bff"],
          },
        ];
        const screens = {
          intro: document.getElementById("introScreen"),
          roulette: document.getElementById("rouletteScreen"),
          game: document.getElementById("gameScreen"),
        };
        const introLogo = document.getElementById("introLogo"),
          introTitle = document.getElementById("introTitle"),
          wheel = document.getElementById("wheel"),
          ctx = wheel.getContext("2d"),
          resultText = document.getElementById("resultText"),
          status = document.getElementById("status"),
          spinBtn = document.getElementById("spinBtn"),
          stopBtn = document.getElementById("stopBtn"),
          selectBtn = document.getElementById("selectBtn"),
          gameHost = document.getElementById("gameHost"),
          gameTitle = document.getElementById("gameTitle"),
          backBtn = document.getElementById("backBtn"),
          modal = document.getElementById("modal"),
          modalTitle = document.getElementById("modalTitle"),
          modalText = document.getElementById("modalText"),
          modalBtn = document.getElementById("modalBtn");
        let currentFrame = null,
          direct = false;
        const state = {
          rot: 0,
          speed: 0,
          spinning: false,
          stopping: false,
          anim: null,
          last: 0,
          result: null,
          lastTick: 0,
        };

        function show(name) {
          Object.values(screens).forEach((s) => s.classList.add("hidden"));
          screens[name].classList.remove("hidden");
        }

        function intro() {
          show("intro");
          requestAnimationFrame(() => {
            introLogo.classList.add("show");
            introTitle.classList.add("show");
          });
          setTimeout(() => show("roulette"), 2600);
        }
        function drawWheel() {
          const W = wheel.width,
            H = wheel.height,
            cx = W / 2,
            cy = H / 2,
            r = 238,
            arc = TAU / options.length;
          ctx.clearRect(0, 0, W, H);
          const bg = ctx.createRadialGradient(cx, cy, 30, cx, cy, r + 26);
          bg.addColorStop(0, "rgba(255,255,255,.22)");
          bg.addColorStop(1, "rgba(255,255,255,.05)");
          ctx.fillStyle = bg;
          ctx.beginPath();
          ctx.arc(cx, cy, r + 24, 0, TAU);
          ctx.fill();
          ctx.save();
          ctx.translate(cx, cy);
          for (let i = 0; i < options.length; i++) {
            const o = options[i],
              start = state.rot - Math.PI / 2 + i * arc,
              end = start + arc,
              g = ctx.createLinearGradient(
                Math.cos(start) * r,
                Math.sin(start) * r,
                Math.cos(end) * r,
                Math.sin(end) * r,
              );
            g.addColorStop(0, o.colors[0]);
            g.addColorStop(1, o.colors[1]);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, r, start, end);
            ctx.closePath();
            ctx.fillStyle = g;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(255,255,255,.55)";
            ctx.stroke();
            ctx.save();
            ctx.rotate(start + arc / 2);
            ctx.fillStyle = "rgba(255,255,255,.18)";
            roundRect(ctx, 58, -48, 136, 96, 20, true, false);
            ctx.textAlign = "center";
            ctx.fillStyle = "#fff";
            ctx.font = "900 22px Arial";
            o.label.forEach((line, idx) =>
              ctx.fillText(line, 126, -21 + idx * 25),
            );
            ctx.restore();
          }
          if (direct) {
            ctx.strokeStyle = "rgba(255,255,255,.95)";
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.arc(0, 0, r + 7, 0, TAU);
            ctx.stroke();
          }
          const cg = ctx.createRadialGradient(0, 0, 8, 0, 0, 78);
          cg.addColorStop(0, "#fff");
          cg.addColorStop(1, "#91a8ff");
          ctx.fillStyle = cg;
          ctx.beginPath();
          ctx.arc(0, 0, 82, 0, TAU);
          ctx.fill();
          ctx.lineWidth = 8;
          ctx.strokeStyle = "rgba(255,255,255,.75)";
          ctx.stroke();
          ctx.fillStyle = "#304479";
          ctx.textAlign = "center";
          ctx.font = "900 20px Arial";
          ctx.fillText("주니주니", 0, -18);
          ctx.fillText("랜덤 게임", 0, 14);
          ctx.restore();
        }
        function loop(ts) {
          const dt = Math.min(0.033, (ts - (state.last || ts)) / 1000);
          state.last = ts;
          if (state.spinning) {
            state.speed += (8.6 - state.speed) * Math.min(1, dt * 5);
            state.rot += state.speed * dt;
            const tick = Math.floor(state.rot / (TAU / 16));
            if (tick !== state.lastTick) {
              state.lastTick = tick;
            }
          } else if (state.stopping && state.anim) {
            const a = state.anim;
            a.t += dt;
            const p = Math.min(1, a.t / a.d),
              e = 1 - Math.pow(1 - p, 3);
            state.rot = a.from + (a.to - a.from) * e;
            if (p >= 1) {
              state.stopping = false;
              state.anim = null;
              state.result = a.index;
              finish(options[a.index]);
            }
          }
          drawWheel();
          requestAnimationFrame(loop);
        }
        function startSpin() {
          if (state.spinning || state.stopping) return;
          direct = false;
          state.result = null;
          state.spinning = true;
          state.speed = Math.max(state.speed, 3);
          spinBtn.disabled = true;
          stopBtn.disabled = false;
          selectBtn.disabled = true;
          resultText.textContent = "룰렛 회전 중...";
          status.textContent = "멈추기 버튼으로 결과를 정하세요.";
        }
        function stopSpin() {
          if (!state.spinning) return;
          state.spinning = false;
          state.stopping = true;
          stopBtn.disabled = true;
          const idx = Math.floor(Math.random() * options.length),
            arc = TAU / options.length;
          let target = -(idx + 0.5) * arc;
          while (target < state.rot + TAU * 4.5) target += TAU;
          state.anim = {
            from: state.rot,
            to: target,
            d: 2.8,
            t: 0,
            index: idx,
          };
          status.textContent = "결과 확인 중...";
        }
        function finish(o) {
          spinBtn.disabled = false;
          selectBtn.disabled = false;
          resultText.textContent = o.title;
          status.textContent =
            o.id === "ai" ? "AI 미션 당첨!" : "게임을 시작합니다.";
          if (o.id === "ai") {
            setTimeout(
              () =>
                showModal(
                  "AI 미션",
                  "의준이 선준이가 AI를 사용해서 직접 게임을 만들어보세요.",
                ),
              500,
            );
          } else setTimeout(() => launch(o.id), 800);
        }
        function enableDirect() {
          if (state.spinning || state.stopping) return;
          direct = true;
          resultText.textContent = "원하는 룰렛 칸을 눌러 직접 선택하세요!";
          status.textContent = "모바일은 터치, PC는 마우스로 선택합니다.";
        }
        function indexFromPointer(e) {
          const r = wheel.getBoundingClientRect(),
            x =
              ((e.clientX - r.left) * wheel.width) / r.width - wheel.width / 2,
            y =
              ((e.clientY - r.top) * wheel.height) / r.height -
              wheel.height / 2,
            d = Math.sqrt(x * x + y * y);
          if (d < 95 || d > 255) return null;
          let ang = Math.atan2(y, x) + Math.PI / 2 - state.rot;
          ang = ((ang % TAU) + TAU) % TAU;
          return Math.floor(ang / (TAU / options.length));
        }
        wheel.addEventListener("pointerdown", (e) => {
          if (!direct) return;
          const idx = indexFromPointer(e);
          if (idx == null) {
            status.textContent = "가운데 말고 바깥 게임 칸을 눌러주세요.";
            return;
          }
          direct = false;
          state.result = idx;
          finish(options[idx]);
        });
        function launch(id) {
          gameHost.innerHTML = "";
          const o = options.find((v) => v.id === id);
          gameTitle.textContent = o.title;
          show("game");
          const iframe = document.createElement("iframe");
          if (BUILD_MODE === "single") {
            iframe.srcdoc = decodeBase64Utf8(GAME_SOURCES[id]);
          } else {
            iframe.src = GAME_FILES[id];
          }
          gameHost.appendChild(iframe);
          currentFrame = iframe;
          setTimeout(() => iframe.focus(), 300);
        }
        function showModal(t, txt) {
          modalTitle.textContent = t;
          modalText.textContent = txt;
          modal.classList.add("show");
        }
        modalBtn.onclick = () => {
          modal.classList.remove("show");
        };
        backBtn.onclick = () => {
          gameHost.innerHTML = "";
          show("roulette");
          resetRoulette();
        };
        function resetRoulette() {
          state.spinning = false;
          state.stopping = false;
          state.anim = null;
          state.speed = 0;
          direct = false;
          spinBtn.disabled = false;
          stopBtn.disabled = true;
          selectBtn.disabled = false;
          resultText.textContent = "룰렛을 돌려 게임을 골라보세요!";
          status.textContent = "돌리기와 멈추기 버튼으로 조작합니다.";
        }
        function decodeBase64Utf8(b64) {
          const bin = atob(b64),
            bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          return new TextDecoder("utf-8").decode(bytes);
        }
        function roundRect(ctx, x, y, w, h, r, fill, stroke) {
          if (w < 2 * r) r = w / 2;
          if (h < 2 * r) r = h / 2;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }
        spinBtn.onclick = startSpin;
        stopBtn.onclick = stopSpin;
        selectBtn.onclick = enableDirect;
        drawWheel();
        requestAnimationFrame(loop);
        intro();
      })();
    </script>
