<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>주니주니 풍선 팡팡 갤럭시</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #203f7c 0%, #0b1331 52%, #020411 100%);
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      touch-action: none;
    }
    body { display: grid; place-items: center; }
    #wrap {
      width: min(100vw, calc(100dvh * 0.5625));
      height: min(100dvh, calc(100vw * 1.7777777778));
      display: grid;
      place-items: center;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      border-radius: 20px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.25);
      background: #060a1c;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="720" height="1280"></canvas></div>
<script>
(() => {
  'use strict';

  const W = 720;
  const H = 1280;
  const TAU = Math.PI * 2;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const GAME_STATE = { TITLE: 'title', PLAYING: 'playing', PAUSED: 'paused', GAMEOVER: 'gameover', WAVE_CLEAR: 'wave_clear' };
  const COLORS = {
    text: '#f4f8ff',
    muted: '#b8c9ff',
    cyan: '#66dcff',
    gold: '#ffd85d',
    pink: '#ff67a7',
    green: '#62e785',
    red: '#ff6475',
    violet: '#b284ff'
  };

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function rand(min, max) { return min + Math.random() * (max - min); }
  function chance(v) { return Math.random() < v; }
  function dist(a, b, c, d) { return Math.hypot(a - c, b - d); }
  function roundRect(c, x, y, w, h, r, fill = true, stroke = false) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
    if (fill) c.fill();
    if (stroke) c.stroke();
  }

  const AudioFX = (() => {
    let ac = null;
    function context() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!ac) ac = new AC();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    }
    function tone(freq, dur, type = 'triangle', vol = 0.04, delay = 0, slide = 0) {
      const ctxx = context();
      if (!ctxx) return;
      const now = ctxx.currentTime + delay;
      const osc = ctxx.createOscillator();
      const gain = ctxx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), now + dur);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain).connect(ctxx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.04);
    }
    function noise(dur = 0.14, vol = 0.025, delay = 0) {
      const ctxx = context();
      if (!ctxx) return;
      const buffer = ctxx.createBuffer(1, Math.floor(ctxx.sampleRate * dur), ctxx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      const src = ctxx.createBufferSource();
      const gain = ctxx.createGain();
      src.buffer = buffer;
      gain.gain.setValueAtTime(vol, ctxx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctxx.currentTime + delay + dur);
      src.connect(gain).connect(ctxx.destination);
      src.start(ctxx.currentTime + delay);
      src.stop(ctxx.currentTime + delay + dur);
    }
    return {
      unlock: context,
      shoot: () => { tone(720, 0.06, 'square', 0.018, 0, 220); },
      hit: () => { tone(420, 0.06, 'triangle', 0.022, 0, -120); noise(0.08, 0.012); },
      pop: () => { tone(540, 0.07, 'sine', 0.032); tone(920, 0.09, 'sine', 0.025, 0.045); noise(0.09, 0.02); },
      power: () => { tone(520, 0.08, 'triangle', 0.03); tone(760, 0.12, 'triangle', 0.03, 0.08); tone(1040, 0.14, 'triangle', 0.032, 0.18); },
      hurt: () => { tone(220, 0.16, 'sawtooth', 0.04, 0, -80); noise(0.20, 0.035); },
      bomb: () => { noise(0.34, 0.06); tone(100, 0.32, 'sawtooth', 0.035, 0, -40); },
      start: () => { tone(523, 0.08, 'triangle', 0.034); tone(659, 0.1, 'triangle', 0.034, 0.08); tone(784, 0.12, 'triangle', 0.038, 0.17); },
      wave: () => { tone(392, 0.08, 'sine', 0.03); tone(523, 0.08, 'sine', 0.03, 0.08); tone(784, 0.16, 'sine', 0.035, 0.18); },
      over: () => { tone(260, 0.16, 'sawtooth', 0.04); tone(140, 0.28, 'sawtooth', 0.035, 0.15); }
    };
  })();

  class Particle {
    constructor(x, y, color, power = 1, kind = 'spark') {
      const a = rand(0, TAU);
      const sp = rand(70, 280) * power;
      this.x = x;
      this.y = y;
      this.vx = Math.cos(a) * sp;
      this.vy = Math.sin(a) * sp;
      this.life = rand(0.4, 0.9);
      this.maxLife = this.life;
      this.size = rand(2, 8) * power;
      this.color = color;
      this.kind = kind;
      this.rot = rand(0, TAU);
      this.spin = rand(-7, 7);
    }
    update(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.vx *= Math.pow(0.82, dt * 6);
      this.vy += 120 * dt;
      this.life -= dt;
      this.rot += this.spin * dt;
    }
    draw(c) {
      const a = clamp(this.life / this.maxLife, 0, 1);
      c.save();
      c.globalAlpha = a;
      c.translate(this.x, this.y);
      c.rotate(this.rot);
      if (this.kind === 'ring') {
        c.strokeStyle = this.color;
        c.lineWidth = 3;
        c.beginPath();
        c.arc(0, 0, this.size * (1.2 - a + 0.2), 0, TAU);
        c.stroke();
      } else {
        c.fillStyle = this.color;
        roundRect(c, -this.size / 2, -this.size / 2, this.size, this.size, 2, true, false);
      }
      c.restore();
    }
  }

  class Bullet {
    constructor(x, y, vx, vy, color, owner, power = 1, radius = 5) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.color = color;
      this.owner = owner;
      this.power = power;
      this.radius = radius;
      this.life = 3;
    }
    update(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.life -= dt;
    }
    draw(c) {
      c.save();
      c.fillStyle = this.color;
      if (this.owner === 'player') {
        const g = c.createLinearGradient(this.x, this.y - 20, this.x, this.y + 12);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.4, this.color);
        g.addColorStop(1, 'rgba(255,255,255,0.15)');
        c.fillStyle = g;
        roundRect(c, this.x - 4, this.y - 20, 8, 28, 5, true, false);
      } else {
        c.beginPath();
        c.arc(this.x, this.y, this.radius, 0, TAU);
        c.fill();
        c.fillStyle = 'rgba(255,255,255,0.35)';
        c.beginPath();
        c.arc(this.x - 2, this.y - 2, this.radius * 0.35, 0, TAU);
        c.fill();
      }
      c.restore();
    }
  }

  class PowerUp {
    constructor(x, y, type) {
      this.x = x;
      this.y = y;
      this.type = type;
      this.vy = 95;
      this.life = 10;
      this.phase = rand(0, TAU);
      this.radius = 18;
      this.color = type === 'spread' ? COLORS.cyan : type === 'shield' ? COLORS.green : type === 'bomb' ? COLORS.pink : COLORS.gold;
      this.label = type === 'spread' ? 'S' : type === 'shield' ? '방' : type === 'bomb' ? 'B' : 'R';
    }
    update(dt) {
      this.phase += dt * 4;
      this.y += this.vy * dt;
      this.x += Math.sin(this.phase) * 24 * dt;
      this.life -= dt;
    }
    draw(c) {
      c.save();
      c.translate(this.x, this.y);
      c.rotate(Math.sin(this.phase) * 0.3);
      const g = c.createRadialGradient(0, 0, 4, 0, 0, 25);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.35, this.color);
      g.addColorStop(1, 'rgba(255,255,255,0.08)');
      c.fillStyle = g;
      c.beginPath();
      c.arc(0, 0, 20, 0, TAU);
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.75)';
      c.lineWidth = 2;
      c.stroke();
      c.fillStyle = '#102047';
      c.font = '900 18px Arial, sans-serif';
      c.textAlign = 'center';
      c.fillText(this.label, 0, 7);
      c.restore();
    }
  }

  class Enemy {
    constructor(col, row, wave) {
      this.col = col;
      this.row = row;
      this.baseX = 92 + col * 74;
      this.baseY = 218 + row * 64;
      this.x = this.baseX;
      this.y = this.baseY - 180;
      this.spawnT = row * 0.18 + col * 0.035;
      this.state = 'entering';
      this.t = 0;
      this.radius = row === 0 ? 26 : row < 3 ? 22 : 19;
      this.hp = row === 0 ? 3 + Math.floor(wave / 3) : row < 3 ? 2 : 1;
      this.maxHp = this.hp;
      const palette = ['#ff5f98', '#ffd45e', '#6fe985', '#65ddff', '#c68cff'];
      this.color = palette[(row + col) % palette.length];
      this.phase = rand(0, TAU);
      this.diveTimer = 0;
      this.pathOffset = rand(-80, 80);
      this.fireCooldown = rand(1.0, 3.2);
      this.scoreValue = row === 0 ? 350 : row < 3 ? 200 : 100;
      this.alive = true;
      this.wasHit = 0;
    }
    homeX(game) { return this.baseX + Math.sin(game.formationPhase + this.row * 0.5) * 26 + game.formationOffset; }
    homeY(game) { return this.baseY + Math.cos(game.formationPhase * 1.4 + this.col * 0.25) * 8; }
    update(dt, game) {
      this.t += dt;
      this.wasHit = Math.max(0, this.wasHit - dt);
      this.fireCooldown -= dt;
      if (this.state === 'entering') {
        const hx = this.homeX(game);
        const hy = this.homeY(game);
        const p = clamp((this.t - this.spawnT) / 1.2, 0, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        this.x = hx + Math.cos((1 - ease) * TAU * 1.3 + this.col) * 120 * (1 - ease);
        this.y = hy - (1 - ease) * 260 + Math.sin(ease * Math.PI) * 40;
        if (p >= 1) this.state = 'formation';
      } else if (this.state === 'formation') {
        this.x += (this.homeX(game) - this.x) * Math.min(1, dt * 8);
        this.y += (this.homeY(game) - this.y) * Math.min(1, dt * 8);
        if (this.fireCooldown <= 0 && chance(0.45)) {
          this.fireCooldown = rand(2.0, 4.6) / Math.max(1, 0.7 + game.wave * 0.08);
          game.enemyShoot(this);
        }
      } else if (this.state === 'diving') {
        this.diveTimer += dt;
        const targetX = game.player.x + this.pathOffset * Math.sin(this.diveTimer * 2.1);
        this.x += (targetX - this.x) * dt * 1.35;
        this.y += (190 + game.wave * 7) * dt;
        this.x += Math.sin(this.diveTimer * 7 + this.phase) * 90 * dt;
        if (this.fireCooldown <= 0) {
          this.fireCooldown = rand(0.8, 1.6);
          game.enemyShoot(this);
        }
        if (this.y > H + 70) {
          this.y = -70;
          this.state = 'returning';
          this.diveTimer = 0;
        }
      } else if (this.state === 'returning') {
        const hx = this.homeX(game);
        const hy = this.homeY(game);
        this.x += (hx - this.x) * Math.min(1, dt * 3.5);
        this.y += (hy - this.y) * Math.min(1, dt * 3.5);
        if (dist(this.x, this.y, hx, hy) < 18) this.state = 'formation';
      }
    }
    startDive(game) {
      if (this.state !== 'formation') return false;
      this.state = 'diving';
      this.diveTimer = 0;
      this.pathOffset = rand(-160, 160);
      this.fireCooldown = rand(0.4, 1.1);
      return true;
    }
    damage(amount, game) {
      this.hp -= amount;
      this.wasHit = 0.12;
      if (this.hp <= 0) {
        this.alive = false;
        game.score += this.scoreValue;
        game.combo += 1;
        game.comboTimer = 1.6;
        if (game.combo > 1) game.score += game.combo * 15;
        game.addPop(this.x, this.y, this.color, this.maxHp > 2 ? 1.4 : 1);
        AudioFX.pop();
        if (chance(this.maxHp >= 3 ? 0.30 : 0.11)) {
          const types = ['rapid', 'spread', 'shield', 'bomb'];
          game.powerUps.push(new PowerUp(this.x, this.y, types[Math.floor(rand(0, types.length))]));
        }
        return true;
      }
      this.wasHit = 0.18;
      game.addSparks(this.x, this.y, this.color, 8, 0.55);
      AudioFX.hit();
      return false;
    }
    draw(c, game) {
      if (!this.alive) return;
      c.save();
      c.translate(this.x, this.y);
      const bob = Math.sin(game.time * 5 + this.phase) * 2;
      c.translate(0, bob);
      if (this.state === 'diving') c.rotate(Math.sin(this.diveTimer * 4) * 0.25);
      const flash = this.wasHit > 0;
      const color = flash ? '#ffffff' : this.color;
      const g = c.createRadialGradient(-8, -10, 4, 0, 2, this.radius + 9);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.28, color);
      g.addColorStop(1, darken(color, 0.32));
      c.fillStyle = g;
      c.beginPath();
      c.ellipse(0, 0, this.radius, this.radius + 7, 0, 0, TAU);
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.32)';
      c.lineWidth = 2;
      c.stroke();
      c.fillStyle = 'rgba(255,255,255,0.35)';
      c.beginPath();
      c.ellipse(-8, -10, this.radius * 0.34, this.radius * 0.42, -0.6, 0, TAU);
      c.fill();
      c.fillStyle = '#ffffff';
      c.beginPath();
      c.moveTo(-7, this.radius + 4);
      c.lineTo(0, this.radius + 14);
      c.lineTo(7, this.radius + 4);
      c.closePath();
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.72)';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(0, this.radius + 12);
      c.quadraticCurveTo(Math.sin(game.time * 5 + this.phase) * 5, this.radius + 24, 0, this.radius + 34);
      c.stroke();
      if (this.maxHp > 1) {
        c.fillStyle = 'rgba(0,0,0,0.32)';
        roundRect(c, -16, -8, 32, 18, 8, true, false);
        c.fillStyle = '#fff';
        c.font = '900 14px Arial, sans-serif';
        c.textAlign = 'center';
        c.fillText(String(this.hp), 0, 6);
      }
      c.restore();
    }
  }

  class Player {
    constructor() {
      this.x = W / 2;
      this.y = 1040;
      this.vx = 0;
      this.vy = 0;
      this.speed = 410;
      this.speedY = 360;
      this.radius = 28;
      this.cooldown = 0;
      this.fireDelay = 0.18;
      this.lives = 3;
      this.invincible = 0;
      this.shield = 0;
      this.rapid = 0;
      this.spread = 0;
      this.bombs = 2;
      this.engine = 0;
      this.alive = true;
    }
    update(dt, game) {
      let inputX = 0;
      let inputY = 0;
      if (game.keys.left) inputX -= 1;
      if (game.keys.right) inputX += 1;
      if (game.keys.up) inputY -= 1;
      if (game.keys.down) inputY += 1;
      this.vx += (inputX * this.speed - this.vx) * Math.min(1, dt * 10);
      this.vy += (inputY * this.speedY - this.vy) * Math.min(1, dt * 10);
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.x = clamp(this.x, 48, W - 48);
      this.y = clamp(this.y, 320, 1050);
      this.cooldown = Math.max(0, this.cooldown - dt);
      this.invincible = Math.max(0, this.invincible - dt);
      this.shield = Math.max(0, this.shield - dt);
      this.rapid = Math.max(0, this.rapid - dt);
      this.spread = Math.max(0, this.spread - dt);
      this.fireDelay = this.rapid > 0 ? 0.095 : 0.18;
      this.engine += dt * 18;
      if (game.keys.fire) this.shoot(game);
    }
    shoot(game) {
      if (this.cooldown > 0 || !this.alive) return;
      const p = this.spread > 0;
      game.playerBullets.push(new Bullet(this.x, this.y - 42, 0, -700, '#ffe66b', 'player', 1, 5));
      if (p) {
        game.playerBullets.push(new Bullet(this.x - 16, this.y - 36, -120, -650, '#79e8ff', 'player', 1, 5));
        game.playerBullets.push(new Bullet(this.x + 16, this.y - 36, 120, -650, '#79e8ff', 'player', 1, 5));
      }
      this.cooldown = this.fireDelay;
      AudioFX.shoot();
      game.addMuzzle(this.x, this.y - 44);
    }
    hit(game) {
      if (this.invincible > 0 || this.shield > 0) {
        this.shield = Math.max(0, this.shield - 2.2);
        this.invincible = 0.2;
        game.addSparks(this.x, this.y, COLORS.cyan, 18, 1.0);
        AudioFX.hit();
        return;
      }
      this.lives -= 1;
      this.invincible = 1.8;
      game.shake = 16;
      game.addExplosion(this.x, this.y, '#ffffff', 1.6);
      AudioFX.hurt();
      if (this.lives <= 0) {
        this.alive = false;
        game.gameOver();
      }
    }
    applyPower(type, game) {
      if (type === 'rapid') this.rapid = 9;
      else if (type === 'spread') this.spread = 9;
      else if (type === 'shield') this.shield = 9;
      else if (type === 'bomb') this.bombs += 1;
      game.score += 150;
      game.showMessage(type === 'rapid' ? '연사 파워업!' : type === 'spread' ? '삼방향 발사!' : type === 'shield' ? '보호막 장착!' : '폭탄 +1!', 1.2);
      AudioFX.power();
    }
    useBomb(game) {
      if (this.bombs <= 0 || game.bombFlash > 0) return;
      this.bombs -= 1;
      game.bombFlash = 0.7;
      game.shake = 24;
      AudioFX.bomb();
      for (const e of game.enemies) if (e.alive) e.damage(2, game);
      game.enemyBullets = [];
      for (let i = 0; i < 45; i++) game.particles.push(new Particle(rand(60, W - 60), rand(160, 800), COLORS.gold, 1.6, i % 3 === 0 ? 'ring' : 'spark'));
    }
    draw(c, game) {
      if (!this.alive && Math.floor(game.time * 8) % 2 === 0) return;
      const blink = this.invincible > 0 && Math.floor(game.time * 12) % 2 === 0;
      c.save();
      c.translate(this.x, this.y);
      if (blink) c.globalAlpha = 0.45;
      const flameSize = 20 + Math.sin(this.engine) * 8;
      const flame = c.createLinearGradient(0, 20, 0, 70);
      flame.addColorStop(0, '#fff8c6');
      flame.addColorStop(0.4, '#ff9b2f');
      flame.addColorStop(1, 'rgba(255,72,64,0)');
      c.fillStyle = flame;
      c.beginPath();
      c.moveTo(-10, 28);
      c.lineTo(0, 28 + flameSize);
      c.lineTo(10, 28);
      c.closePath();
      c.fill();
      const body = c.createLinearGradient(-26, -30, 26, 30);
      body.addColorStop(0, '#65e2ff');
      body.addColorStop(0.5, '#ffffff');
      body.addColorStop(1, '#496dff');
      c.fillStyle = body;
      c.beginPath();
      c.moveTo(0, -52);
      c.bezierCurveTo(20, -20, 22, 14, 10, 36);
      c.lineTo(0, 28);
      c.lineTo(-10, 36);
      c.bezierCurveTo(-22, 14, -20, -20, 0, -52);
      c.fill();
      c.fillStyle = '#5d8dff';
      c.beginPath();
      c.moveTo(-8, -4);
      c.lineTo(-58, 28);
      c.lineTo(-16, 34);
      c.lineTo(0, 15);
      c.closePath();
      c.fill();
      c.beginPath();
      c.moveTo(8, -4);
      c.lineTo(58, 28);
      c.lineTo(16, 34);
      c.lineTo(0, 15);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(255,255,255,0.65)';
      c.beginPath();
      c.ellipse(0, -20, 11, 20, 0, 0, TAU);
      c.fill();
      c.fillStyle = '#ffd85d';
      c.beginPath();
      c.moveTo(0, -58);
      c.lineTo(-7, -36);
      c.lineTo(7, -36);
      c.closePath();
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.35)';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(0, -52);
      c.lineTo(0, 32);
      c.stroke();
      if (this.shield > 0) {
        c.globalAlpha = 0.42 + Math.sin(game.time * 10) * 0.15;
        c.strokeStyle = COLORS.cyan;
        c.lineWidth = 4;
        c.beginPath();
        c.arc(0, 0, 66, 0, TAU);
        c.stroke();
        c.globalAlpha = 0.12;
        c.fillStyle = COLORS.cyan;
        c.beginPath();
        c.arc(0, 0, 66, 0, TAU);
        c.fill();
      }
      c.restore();
    }
  }

  class BalloonGalagaGame {
    constructor() {
      this.state = GAME_STATE.TITLE;
      this.player = new Player();
      this.enemies = [];
      this.playerBullets = [];
      this.enemyBullets = [];
      this.powerUps = [];
      this.particles = [];
      this.keys = { left: false, right: false, up: false, down: false, fire: false };
      this.touchButtons = [];
      this.score = 0;
      this.best = Number(localStorage.getItem('joonyjoony_balloon_best') || 0);
      this.wave = 1;
      this.combo = 0;
      this.comboTimer = 0;
      this.time = 0;
      this.formationPhase = 0;
      this.formationOffset = 0;
      this.diveCountdown = 1.8;
      this.spawnTimer = 0;
      this.shake = 0;
      this.bombFlash = 0;
      this.message = '풍선 팡팡 갤럭시';
      this.messageTimer = 0;
      this.waveClearTimer = 0;
      this.stars = Array.from({ length: 120 }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(0.6, 2.1), s: rand(20, 90), a: rand(0.2, 0.9) }));
      this.nebula = Array.from({ length: 18 }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(40, 140), a: rand(0.02, 0.07), c: chance(0.5) ? COLORS.cyan : COLORS.pink }));
      this.initEvents();
    }

    start() {
      AudioFX.unlock();
      AudioFX.start();
      this.state = GAME_STATE.PLAYING;
      this.player = new Player();
      this.enemies = [];
      this.playerBullets = [];
      this.enemyBullets = [];
      this.powerUps = [];
      this.particles = [];
      this.score = 0;
      this.wave = 1;
      this.combo = 0;
      this.comboTimer = 0;
      this.time = 0;
      this.formationPhase = 0;
      this.formationOffset = 0;
      this.shake = 0;
      this.bombFlash = 0;
      this.showMessage('웨이브 1 시작!', 1.4);
      this.spawnWave();
    }

    spawnWave() {
      this.enemies = [];
      const rows = 5;
      const cols = 8;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          this.enemies.push(new Enemy(col, row, this.wave));
        }
      }
      if (this.wave % 3 === 0) {
        const boss = new Enemy(3.5, -1, this.wave + 3);
        boss.baseX = W / 2;
        boss.baseY = 166;
        boss.radius = 38;
        boss.hp = 9 + this.wave;
        boss.maxHp = boss.hp;
        boss.scoreValue = 1200 + this.wave * 90;
        boss.color = COLORS.pink;
        boss.spawnT = 0;
        this.enemies.push(boss);
      }
      this.diveCountdown = Math.max(0.7, 2.2 - this.wave * 0.12);
      AudioFX.wave();
    }

    gameOver() {
      this.state = GAME_STATE.GAMEOVER;
      AudioFX.over();
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('joonyjoony_balloon_best', String(this.best));
      }
      this.showMessage('게임 오버!', 99);
    }

    togglePause() {
      if (this.state === GAME_STATE.PLAYING) {
        this.state = GAME_STATE.PAUSED;
        this.showMessage('일시정지', 999);
      } else if (this.state === GAME_STATE.PAUSED) {
        this.state = GAME_STATE.PLAYING;
        this.showMessage('다시 출격!', 0.9);
      }
    }

    showMessage(msg, t = 1) {
      this.message = msg;
      this.messageTimer = t;
    }

    addSparks(x, y, color, count, power = 1) {
      for (let i = 0; i < count; i++) this.particles.push(new Particle(x, y, color, power));
    }
    addPop(x, y, color, power = 1) {
      for (let i = 0; i < 18; i++) this.particles.push(new Particle(x, y, color, power));
      for (let i = 0; i < 4; i++) this.particles.push(new Particle(x, y, '#ffffff', power, 'ring'));
    }
    addExplosion(x, y, color, power = 1) {
      for (let i = 0; i < 30; i++) this.particles.push(new Particle(x, y, color, power));
      for (let i = 0; i < 8; i++) this.particles.push(new Particle(x, y, COLORS.gold, power * 1.2, 'ring'));
    }
    addMuzzle(x, y) {
      for (let i = 0; i < 4; i++) this.particles.push(new Particle(x, y, COLORS.gold, 0.5));
    }

    enemyShoot(enemy) {
      if (!enemy.alive || this.state !== GAME_STATE.PLAYING) return;
      const dx = this.player.x - enemy.x;
      const dy = this.player.y - enemy.y;
      const length = Math.hypot(dx, dy) || 1;
      const speed = 190 + this.wave * 18;
      const vx = dx / length * speed;
      const vy = dy / length * speed;
      this.enemyBullets.push(new Bullet(enemy.x, enemy.y + enemy.radius + 8, vx, vy, '#ff7b97', 'enemy', 1, 6));
    }

    pickDiver() {
      const candidates = this.enemies.filter(e => e.alive && e.state === 'formation');
      if (!candidates.length) return;
      const rowWeight = candidates.sort((a, b) => a.row - b.row);
      const enemy = rowWeight[Math.floor(rand(0, Math.min(rowWeight.length, 10)))];
      if (enemy.startDive(this)) {
        this.showMessage('풍선 편대 급강하!', 0.65);
      }
    }

    update(dt) {
      this.time += dt;
      this.updateBackground(dt);
      this.particles.forEach(p => p.update(dt));
      this.particles = this.particles.filter(p => p.life > 0);
      this.shake = Math.max(0, this.shake - dt * 28);
      this.bombFlash = Math.max(0, this.bombFlash - dt);
      if (this.messageTimer < 90) this.messageTimer = Math.max(0, this.messageTimer - dt);
      if (this.comboTimer > 0) this.comboTimer -= dt;
      else this.combo = 0;

      if (this.state !== GAME_STATE.PLAYING) return;
      this.player.update(dt, this);
      this.formationPhase += dt * (1.2 + this.wave * 0.04);
      this.formationOffset = Math.sin(this.formationPhase * 0.7) * Math.min(54, 26 + this.wave * 2);
      this.diveCountdown -= dt;
      if (this.diveCountdown <= 0) {
        this.diveCountdown = rand(Math.max(0.55, 1.8 - this.wave * 0.1), Math.max(0.9, 2.8 - this.wave * 0.12));
        this.pickDiver();
        if (this.wave >= 4 && chance(0.4)) setTimeout(() => this.pickDiver(), 280);
      }

      this.enemies.forEach(e => e.update(dt, this));
      this.enemies = this.enemies.filter(e => e.alive);
      this.playerBullets.forEach(b => b.update(dt));
      this.enemyBullets.forEach(b => b.update(dt));
      this.powerUps.forEach(p => p.update(dt));
      this.playerBullets = this.playerBullets.filter(b => b.life > 0 && b.y > -80 && b.x > -80 && b.x < W + 80);
      this.enemyBullets = this.enemyBullets.filter(b => b.life > 0 && b.y < H + 80 && b.x > -80 && b.x < W + 80);
      this.powerUps = this.powerUps.filter(p => p.life > 0 && p.y < H + 60);

      this.handleCollisions();
      if (this.enemies.length === 0) {
        this.wave += 1;
        this.score += 1000;
        this.showMessage(`웨이브 ${this.wave} 진입!`, 1.4);
        this.spawnWave();
      }
    }

    updateBackground(dt) {
      this.stars.forEach(s => {
        s.y += (s.s + this.wave * 2) * dt;
        if (s.y > H) { s.y = -5; s.x = rand(0, W); }
      });
      this.nebula.forEach(n => {
        n.y += 8 * dt;
        if (n.y - n.r > H) { n.y = -n.r; n.x = rand(0, W); }
      });
    }

    handleCollisions() {
      for (let i = this.playerBullets.length - 1; i >= 0; i--) {
        const b = this.playerBullets[i];
        let hit = false;
        for (let j = this.enemies.length - 1; j >= 0; j--) {
          const e = this.enemies[j];
          if (!e.alive) continue;
          if (dist(b.x, b.y, e.x, e.y) < e.radius + b.radius + 3) {
            e.damage(b.power, this);
            this.playerBullets.splice(i, 1);
            hit = true;
            break;
          }
        }
        if (hit) continue;
      }
      for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
        const b = this.enemyBullets[i];
        if (dist(b.x, b.y, this.player.x, this.player.y) < this.player.radius + b.radius) {
          this.enemyBullets.splice(i, 1);
          this.player.hit(this);
        }
      }
      for (const e of this.enemies) {
        if (e.alive && dist(e.x, e.y, this.player.x, this.player.y) < e.radius + this.player.radius) {
          e.damage(99, this);
          this.player.hit(this);
        }
      }
      for (let i = this.powerUps.length - 1; i >= 0; i--) {
        const p = this.powerUps[i];
        if (dist(p.x, p.y, this.player.x, this.player.y) < this.player.radius + p.radius + 10) {
          this.powerUps.splice(i, 1);
          this.player.applyPower(p.type, this);
        }
      }
    }

    initEvents() {
      window.addEventListener('keydown', e => {
        AudioFX.unlock();
        const key = e.key.toLowerCase();
        if (e.key === 'ArrowLeft' || key === 'a') this.keys.left = true;
        else if (e.key === 'ArrowRight' || key === 'd') this.keys.right = true;
        else if (e.key === 'ArrowUp' || key === 'w') { e.preventDefault(); this.keys.up = true; }
        else if (e.key === 'ArrowDown' || key === 's') { e.preventDefault(); this.keys.down = true; }
        else if (e.code === 'Space' || key === 'j') { e.preventDefault(); this.keys.fire = true; }
        else if (key === 'k' || key === 'b') { if (!e.repeat) this.player.useBomb(this); }
        else if (key === 'p' || e.key === 'Escape') { if (!e.repeat) this.togglePause(); }
        else if (e.key === 'Enter') { if (!e.repeat && (this.state === GAME_STATE.TITLE || this.state === GAME_STATE.GAMEOVER)) this.start(); }
      });
      window.addEventListener('keyup', e => {
        const key = e.key.toLowerCase();
        if (e.key === 'ArrowLeft' || key === 'a') this.keys.left = false;
        if (e.key === 'ArrowRight' || key === 'd') this.keys.right = false;
        if (e.key === 'ArrowUp' || key === 'w') this.keys.up = false;
        if (e.key === 'ArrowDown' || key === 's') this.keys.down = false;
        if (e.code === 'Space' || key === 'j') this.keys.fire = false;
      });
      canvas.addEventListener('pointerdown', e => this.pointer(e, true), { passive: false });
      canvas.addEventListener('pointerup', e => this.pointer(e, false), { passive: false });
      canvas.addEventListener('pointercancel', e => this.pointer(e, false), { passive: false });
      canvas.addEventListener('pointerleave', e => this.pointer(e, false), { passive: false });
      canvas.addEventListener('contextmenu', e => e.preventDefault());
    }

    pointer(e, isDown) {
      e.preventDefault();
      AudioFX.unlock();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width * W;
      const y = (e.clientY - rect.top) / rect.height * H;
      if (!isDown) {
        this.keys.left = false;
        this.keys.right = false;
        this.keys.up = false;
        this.keys.down = false;
        this.keys.fire = false;
        return;
      }
      for (const btn of this.touchButtons) {
        if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
          if (btn.holdKey) this.keys[btn.holdKey] = true;
          else btn.action();
          return;
        }
      }
      if (this.state === GAME_STATE.TITLE || this.state === GAME_STATE.GAMEOVER) this.start();
    }

    drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#102d66');
      g.addColorStop(0.45, '#07163a');
      g.addColorStop(1, '#020410');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      this.nebula.forEach(n => {
        ctx.save();
        ctx.globalAlpha = n.a;
        const rg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
        rg.addColorStop(0, n.c);
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, TAU);
        ctx.fill();
        ctx.restore();
      });
      this.stars.forEach(s => {
        ctx.globalAlpha = s.a;
        ctx.fillStyle = '#fff';
        ctx.fillRect(s.x, s.y, s.r, s.r);
      });
      ctx.globalAlpha = 1;
    }

    drawFrame() {
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      roundRect(ctx, 18, 18, W - 36, 126, 28, true, false);
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 2;
      roundRect(ctx, 18, 18, W - 36, 126, 28, false, true);
      ctx.fillStyle = COLORS.text;
      ctx.font = '900 40px Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('풍선 팡팡 갤럭시', 38, 68);
      ctx.fillStyle = COLORS.muted;
      ctx.font = '700 19px Arial, sans-serif';
      ctx.fillText('비행기를 조종해 풍선 편대를 격파하세요', 40, 106);
      ctx.textAlign = 'right';
      ctx.fillStyle = COLORS.gold;
      ctx.font = '900 28px Arial, sans-serif';
      ctx.fillText(String(this.score), 660, 66);
      ctx.fillStyle = COLORS.muted;
      ctx.font = '700 16px Arial, sans-serif';
      ctx.fillText('SCORE', 660, 96);
    }

    drawHUD() {
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      roundRect(ctx, 28, 156, 664, 56, 20, true, false);
      ctx.strokeStyle = 'rgba(255,255,255,0.13)';
      roundRect(ctx, 28, 156, 664, 56, 20, false, true);
      ctx.textAlign = 'left';
      ctx.font = '900 20px Arial, sans-serif';
      ctx.fillStyle = COLORS.text;
      ctx.fillText(`웨이브 ${this.wave}`, 48, 191);
      ctx.fillStyle = COLORS.muted;
      ctx.fillText(`최고 ${this.best}`, 184, 191);
      ctx.fillStyle = COLORS.green;
      ctx.fillText(`라이프 ${this.player.lives}`, 348, 191);
      ctx.fillStyle = COLORS.pink;
      ctx.fillText(`폭탄 ${this.player.bombs}`, 488, 191);
      if (this.combo > 1 && this.comboTimer > 0) {
        ctx.textAlign = 'center';
        ctx.fillStyle = COLORS.gold;
        ctx.font = '900 28px Arial, sans-serif';
        ctx.fillText(`${this.combo} COMBO!`, W / 2, 250);
      }
      const barX = 46;
      let y = 1010;
      if (this.player.rapid > 0) this.drawPowerBar(barX, y, 180, '연사', this.player.rapid / 9, COLORS.gold), y += 28;
      if (this.player.spread > 0) this.drawPowerBar(barX, y, 180, '삼방향', this.player.spread / 9, COLORS.cyan), y += 28;
      if (this.player.shield > 0) this.drawPowerBar(barX, y, 180, '보호막', this.player.shield / 9, COLORS.green);
    }

    drawPowerBar(x, y, w, label, value, color) {
      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      roundRect(ctx, x, y, w, 18, 9, true, false);
      ctx.fillStyle = color;
      roundRect(ctx, x, y, w * clamp(value, 0, 1), 18, 9, true, false);
      ctx.fillStyle = '#fff';
      ctx.font = '900 12px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, x + w / 2, y + 13);
    }

    drawControls() {
      this.touchButtons = [];
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      roundRect(ctx, 28, 1094, W - 56, 158, 28, true, false);
      ctx.strokeStyle = 'rgba(255,255,255,0.13)';
      ctx.lineWidth = 2;
      roundRect(ctx, 28, 1094, W - 56, 158, 28, false, true);
      const buttons = [
        { label: '▲', x: 150, y: 1118, w: 92, h: 48, holdKey: 'up' },
        { label: '◀', x: 52, y: 1174, w: 92, h: 58, holdKey: 'left' },
        { label: '▼', x: 150, y: 1174, w: 92, h: 58, holdKey: 'down' },
        { label: '▶', x: 248, y: 1174, w: 92, h: 58, holdKey: 'right' },
        { label: '발사', x: 364, y: 1130, w: 116, h: 92, holdKey: 'fire' },
        { label: '폭탄', x: 494, y: 1130, w: 78, h: 92, action: () => this.player.useBomb(this) },
        { label: '시작', x: 584, y: 1130, w: 84, h: 92, action: () => { if (this.state === GAME_STATE.TITLE || this.state === GAME_STATE.GAMEOVER) this.start(); else this.togglePause(); } }
      ];
      buttons.forEach(btn => this.drawButton(btn));
      ctx.fillStyle = COLORS.muted;
      ctx.font = '700 16px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('PC: ←→↑↓ 또는 WASD 이동 / Space·J 발사 / B·K 폭탄 / P 일시정지', W / 2, 1244);
    }

    drawButton(btn) {
      this.touchButtons.push(btn);
      const g = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
      g.addColorStop(0, 'rgba(255,255,255,0.20)');
      g.addColorStop(1, 'rgba(95,125,255,0.84)');
      ctx.fillStyle = g;
      roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 20, true, false);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 20, false, true);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 24px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2 + 8);
    }

    drawScene() {
      this.drawBackground();
      ctx.save();
      if (this.shake > 0) ctx.translate(rand(-this.shake, this.shake), rand(-this.shake, this.shake));
      this.drawFrame();
      this.drawHUD();
      this.enemies.forEach(e => e.draw(ctx, this));
      this.powerUps.forEach(p => p.draw(ctx));
      this.playerBullets.forEach(b => b.draw(ctx));
      this.enemyBullets.forEach(b => b.draw(ctx));
      this.player.draw(ctx, this);
      ctx.restore();
      this.particles.forEach(p => p.draw(ctx));
      if (this.bombFlash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${this.bombFlash * 0.42})`;
        ctx.fillRect(0, 0, W, H);
      }
      this.drawControls();
      this.drawOverlay();
    }

    drawOverlay() {
      let title = '';
      let subtitle = '';
      let big = false;
      if (this.state === GAME_STATE.TITLE) {
        title = '풍선 팡팡 갤럭시';
        subtitle = '갤러그 스타일 비행기 슈팅!\n풍선 편대가 급강하하기 전에 전부 터뜨리세요.\nEnter 또는 화면 터치로 출격합니다.';
        big = true;
      } else if (this.state === GAME_STATE.PAUSED) {
        title = '일시정지';
        subtitle = 'P 또는 시작 버튼으로 계속합니다.';
        big = true;
      } else if (this.state === GAME_STATE.GAMEOVER) {
        title = '게임 오버';
        subtitle = `최종 점수 ${this.score}\nEnter 또는 시작 버튼으로 다시 출격!`;
        big = true;
      } else if (this.messageTimer > 0) {
        title = this.message;
      }
      if (!title) return;
      ctx.save();
      const alpha = big ? 1 : clamp(this.messageTimer / 0.45, 0, 1);
      ctx.globalAlpha = alpha;
      if (big) {
        ctx.fillStyle = 'rgba(0,0,0,0.62)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(255,255,255,0.13)';
        roundRect(ctx, 60, 410, W - 120, 336, 36, true, false);
        ctx.strokeStyle = 'rgba(255,255,255,0.23)';
        ctx.lineWidth = 3;
        roundRect(ctx, 60, 410, W - 120, 336, 36, false, true);
      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.43)';
        roundRect(ctx, 110, 292, W - 220, 94, 28, true, false);
      }
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = big ? '900 46px Arial, sans-serif' : '900 30px Arial, sans-serif';
      ctx.fillText(title, W / 2, big ? 500 : 348);
      if (subtitle) {
        ctx.font = '700 22px Arial, sans-serif';
        ctx.fillStyle = '#d8e2ff';
        subtitle.split('\n').forEach((line, i) => ctx.fillText(line, W / 2, 562 + i * 34));
      }
      ctx.restore();
    }
  }

  function darken(hex, amount) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0,2), 16);
    const g = parseInt(h.slice(2,4), 16);
    const b = parseInt(h.slice(4,6), 16);
    const f = 1 - amount;
    return '#' + [r*f, g*f, b*f].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  }

  const game = new BalloonGalagaGame();
  let last = 0;
  function loop(ts) {
    if (!last) last = ts;
    const dt = Math.min(0.033, (ts - last) / 1000);
    last = ts;
    game.update(dt);
    game.drawScene();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
